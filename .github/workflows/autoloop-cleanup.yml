name: AI-DLC Label Cleanup
on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Remove AI-DLC labels from linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              'ready', 'rejected', 'needs-decomposition',
              'in-progress', 'in-review', 'needs-human',
              'p0', 'p1', 'p2'
            ];
            const body = context.payload.pull_request.body || '';
            const matches = body.match(/Closes #(\d+)/g) || [];
            for (const match of matches) {
              const issueNumber = parseInt(match.replace('Closes #', ''));
              for (const label of labels) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: label
                  });
                } catch (e) {}
              }
            }

  auto-close-parent:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Auto-close parent issue when last sub-issue completes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ai-dlc/auto_close_parent.py "${{ github.event.pull_request.number }}"

  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Extract cost from PR body
        id: extract-cost
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const body = context.payload.pull_request.body || '';
            const match = body.match(/- Cost: \$(\d+\.?\d*)/);
            return match ? match[1] : '0.00';
      - name: Update changelog
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_COST: ${{ steps.extract-cost.outputs.result }}
        run: |
          python eval/cognitive/update_changelog.py \
            --number "$PR_NUMBER" \
            --title "$PR_TITLE" \
            --cost "$PR_COST"
      - name: Commit and push changelog
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/cognitive/CHANGELOG.md
          git add eval/cognitive/changelog-archive.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update changelog after #${PR_NUMBER}"
          git push

  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bump version from PR title
        run: python eval/cognitive/bump_version.py "${{ github.event.pull_request.title }}"
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet pyproject.toml || (git add pyproject.toml && git commit -m "chore: bump version [skip ci]" && git push)
