name: Autoloop Cleanup
on:
  pull_request:
    types:
      - opened
      - reopened
      - closed
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
  # Refresh the review queue when CI finishes.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  issues: write
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Remove autoloop labels from linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              'ready', 'rejected', 'needs-decomposition',
              'in-progress', 'in-review', 'needs-human',
              'p0', 'p1', 'p2'
            ];
            const body = context.payload.pull_request.body || '';
            const matches = body.match(/Closes #(\d+)/g) || [];
            for (const match of matches) {
              const issueNumber = parseInt(match.replace('Closes #', ''));
              for (const label of labels) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: label
                  });
                } catch (e) {}
              }
            }

  auto-close-parent:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install autoloop
        run: pip install git+https://github.com/Sanctum-Origo-Systems/autoloop@v0.1.0
      - name: Auto-close parent issue when last sub-issue completes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: autoloop auto-close-parent "${{ github.event.pull_request.number }}"

  auto-tag:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'chore: update changelog and version')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create version tag
        run: |
          VERSION=$(python3 -c "import re; m=re.search(r'version\s*=\s*\"(.+?)\"', open('pyproject.toml').read()); print(m.group(1) if m else '')")
          if [ -n "$VERSION" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Tagged v${VERSION}"
          fi

  # Rebuilds the Review Queue issue from live PR state on every PR change and CI run.
  # The other jobs only act on merged PRs, so the extra triggers don't change them.
  review-queue:
    runs-on: ubuntu-latest
    concurrency:
      group: review-queue
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
    steps:
      # Read autoloop.toml from the default branch, never from the PR under review.
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install autoloop
        run: pip install git+https://github.com/Sanctum-Origo-Systems/autoloop@v0.21.0
      - name: Refresh review queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: autoloop review-queue
