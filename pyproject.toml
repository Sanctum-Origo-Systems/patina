[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patina"
version = "0.9.0"
description = "A cognitive app that compounds — learns you, mirrors your judgment, and improves with every interaction."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "mcp[cli]>=1.0",
    "pyyaml>=6",
    "claude-agent-sdk>=0.2",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Sanctum-Origo-Systems/patina"
Repository = "https://github.com/Sanctum-Origo-Systems/patina"

[project.scripts]
patina = "patina.cli:app"
patina-mcp = "patina.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patina"]

[dependency-groups]
dev = [
    "autoloop @ git+https://github.com/Sanctum-Origo-Systems/autoloop@v0.1.0",
    "black>=26.5.1",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_demo_export.py" = ["E501"]
