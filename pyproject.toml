[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patina"
version = "0.2.0"
description = "A cognitive app that compounds — learns you, mirrors your judgment, and improves with every interaction."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "mcp[cli]>=1.0",
    "pyyaml>=6",
    "claude-agent-sdk>=0.2",
    "starlette>=0.38",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Sanctum-Origo-Systems/patina"
Repository = "https://github.com/Sanctum-Origo-Systems/patina"

[project.scripts]
patina = "patina.cli:app"
patina-mcp = "patina.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patina"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
